name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the build needs is listed here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      # The dats phase sandboxes every command it runs and fails when no backend exists.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Builds, tests, and runs dats/*.dats -- the HTTP surface and the cache round trip both live there.
      # Pinned to a commit, not @master: the floating ref was observed resolving to a stale cached
      # snapshot of action.yml (missing inputs current master actually declares) and, independently,
      # to whatever commit master happened to be on -- including a red one -- at request time. A
      # pinned SHA is deterministic on both counts. Bump this by hand when a newer go-toolchain
      # feature is needed.
      - uses: wow-look-at-my/go-toolchain@ca698ebc5e9d5af0f24d858d730458e5ff626edf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  docker:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read
      checks: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - uses: wow-look-at-my/actions@go-packages#latest
        with:
          skip-build: 'true'

