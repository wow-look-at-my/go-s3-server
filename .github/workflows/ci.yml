name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the build needs is listed here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      # The dats phase sandboxes every command it runs and fails when no backend exists.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Builds, tests, runs dats/*.dats, and autoreleases the binary buildhost serves as an image.
      - uses: wow-look-at-my/go-toolchain@master

  # cacheclient is its own module, so go-toolchain must run in it too; beside the server's job, not after it.
  cacheclient:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      # A cold `go mod tidy` here runs about 7 minutes, which leaves the 10-minute default no room for vet and the tests.
      - uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: cacheclient
          timeout: 20

