name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the build needs is listed here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      # The dats phase sandboxes every command it runs and fails when no backend exists.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Builds, tests, runs dats/*.dats, and autoreleases the binary buildhost serves as an image.
      - uses: wow-look-at-my/go-toolchain@master

      # cacheclient is its own Go module, so the run above never executes its
      # tests: a root run vets and covers it and stops there. Without this step
      # the client half of the wire protocol gates nothing, and a test added
      # beside it passes by never running. It publishes nothing -- the client is
      # a library, and the release above is the server.
      - uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: cacheclient
          autorelease: 'false'

