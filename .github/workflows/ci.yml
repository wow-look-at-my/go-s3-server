name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the build needs is listed here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      # The dats phase sandboxes every command it runs and fails when no backend exists.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Builds, tests, and runs dats/*.dats -- the HTTP surface and the cache round trip both live there.
      # wait-ci explicit: the floating @master ref can resolve to a different go-toolchain commit
      # than the one that set its own default, so this repo's CI must never depend on go-toolchain's
      # own CI status to build itself.
      - uses: wow-look-at-my/go-toolchain@master
        with:
          wait-ci: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  docker:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read
      checks: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build
      - uses: wow-look-at-my/actions@go-packages#latest
        with:
          skip-build: 'true'

