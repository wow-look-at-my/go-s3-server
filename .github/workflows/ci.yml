name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the build needs is listed here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      # The dats phase sandboxes every command it runs and fails when no backend exists.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Builds, tests, and runs dats/*.dats -- the HTTP surface and the cache round trip both live there.
      - uses: wow-look-at-my/go-toolchain@master

  # Publishes oci.pazer.build/go-s3-server, which is what the deployment pulls
  # and what docker-updater tracks. Authentication is a GHA OIDC token, so there
  # is no registry secret stored anywhere; the project auto-provisions on first
  # push. :latest moves only on the default branch -- a feature-branch push
  # publishes under its own tag and leaves stable consumers alone.
  #
  # This replaces the job removed in #65, which referenced a nonexistent action
  # and had no Dockerfile to build. Both of those now exist.
  docker:
    needs: test
    # ubuntu-latest ON PURPOSE, not the self-hosted runner: this host carries a
    # registered APE binfmt handler (/proc/sys/fs/binfmt_misc/APE), which makes
    # the kernel run an APE through a shell and masks the exact defect the
    # Dockerfile exists to prevent. A hosted runner has no such handler, so a
    # regression back to a bare-APE entrypoint fails the build instead of
    # shipping an image that cannot start.
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so every grant the
    # publish needs is listed here. id-token: write is what the OIDC login uses.
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      # go-toolchain hands build/ over through the org cache rather than
      # upload-artifact, so restore it before the image copies the binary out.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build/
      - run: chmod +x build/go-s3-server
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-docker@master

